<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Brick Breaker Lab</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Brick Breaker test game">
      <button class="touch-lane lane-left" data-hold="left" aria-label="Move left">
        <span class="lane-arrow">‹</span>
        <span>Hold left</span>
      </button>

      <section class="stage-column">
        <header class="game-header">
          <div>
            <p class="eyebrow">Games lab</p>
            <h1>Brick Breaker</h1>
          </div>
          <div class="stats" aria-live="polite">
            <span>Level <strong id="levelLabel">1</strong></span>
            <span>Score <strong id="scoreLabel">0</strong></span>
            <span>Lives <strong id="livesLabel">3</strong></span>
          </div>
        </header>

        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="960" height="720" aria-label="Brick breaker playfield"></canvas>
          <div class="screen-message" id="messagePanel">
            <h2 id="messageTitle">Ready?</h2>
            <p id="messageText">Break all colored bricks. Metal bricks stay on the board.</p>
            <button id="startButton" class="primary">Start game</button>
          </div>
        </div>

        <footer class="controls">
          <button id="restartButton">Restart</button>
          <button id="pauseButton">Pause</button>
          <button id="nextButton" hidden>Next level</button>
        </footer>
      </section>

      <button class="touch-lane lane-right" data-hold="right" aria-label="Move right">
        <span class="lane-arrow">&gt;</span>
        <span>Hold right</span>
      </button>
    </main>

    <script src="brick-breaker.js"></script>
  </body>
</html>
